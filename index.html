<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>വരിസംഖ്യാ കാർഡ് മാനേജുമെന്റ് സിസ്റ്റം</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Meera Inimai', 'Gayathri', Arial, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 10px;
            color: #111;
            font-size: 20px; /* മൊബൈൽ വായനയ്ക്ക് അനുയോജ്യമായ വലിയ ഫോണ്ട് സൈസ് */
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .main-title {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #006633;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #006633;
        }

        .header-section {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .header-box {
            flex: 1;
            min-width: 100%;
            display: flex;
            flex-direction: column;
        }
        .header-box label {
            font-weight: bold;
            font-size: 19px;
            color: #006633;
            margin-bottom: 6px;
        }
        .header-box input {
            padding: 14px;
            font-size: 20px;
            border: 2px solid #006633;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
        }

        .stats-container {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .stat-box {
            flex: 1;
            background: #f8f9fa;
            border: 2px solid #28a745;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            min-width: 100%;
        }
        .stat-box h4 {
            margin: 0 0 6px 0;
            font-size: 18px;
            color: #333;
        }
        .stat-box .amount {
            font-size: 26px;
            font-weight: bold;
            color: #28a745;
        }

        .tracker-box {
            background: #fff8e1;
            border: 2px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .tracker-box h3 {
            margin-top: 0;
            font-size: 20px;
            color: #856404;
            text-align: center;
        }
        .tracker-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tracker-controls select {
            padding: 12px;
            font-size: 19px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-weight: bold;
        }
        .tracker-results {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .result-col {
            flex: 1;
            background: #fff;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            min-width: 100%;
            max-height: 180px;
            overflow-y: auto;
        }
        .result-col h5 {
            margin: 0 0 6px 0;
            font-size: 18px;
        }
        .result-col ul {
            margin: 0;
            padding-left: 20px;
            font-size: 18px;
        }
        .result-col li {
            cursor: pointer;
            color: #0056b3;
            margin-bottom: 6px;
        }
        .result-col li:hover {
            text-decoration: underline;
        }

        .nav-buttons, .action-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 12px;
        }
        button {
            background-color: #006633;
            color: white;
            border: none;
            padding: 15px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            flex: 1;
            min-width: 45%;
        }
        button:hover { background-color: #004d26; }
        .btn-secondary { background-color: #007bff; }
        .btn-secondary:hover { background-color: #0056b3; }
        .btn-whatsapp { background-color: #25d366; color: #fff; }
        .btn-whatsapp:hover { background-color: #128c7e; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        .btn-bulk-print { background-color: #6f42c1; }
        .btn-bulk-print:hover { background-color: #5a32a3; }
        
        .card-box {
            border: 2px solid #222;
            padding: 18px;
            border-radius: 8px;
            background: #fff;
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            gap: 6px;
        }
        .form-row label {
            font-weight: bold;
            font-size: 19px;
        }
        .form-row input, .form-row select {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #aaa;
            border-radius: 6px;
            font-size: 20px;
        }
        
        /* Mobile layout for Class, Roll No, Fee */
        .inline-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        .inline-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }
        .inline-item label {
            font-size: 19px;
            font-weight: bold;
        }
        .inline-item input {
            width: 100%;
            padding: 14px;
            font-size: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        table, th, td {
            border: 2px solid #333;
        }
        th, td {
            padding: 10px 6px;
            text-align: center;
            font-size: 17px;
        }
        th {
            background-color: #f1f3f5;
            font-weight: bold;
            font-size: 18px;
        }
        td input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
            font-size: 18px;
        }
        .btn-now {
            padding: 8px 10px;
            font-size: 15px;
            min-width: auto;
            background-color: #17a2b8;
            flex: initial;
        }
        .btn-now:hover { background-color: #117a8b; }

        .signature-container {
            border: 1.5px dashed #666;
            background: #fafafa;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            text-align: center;
        }
        canvas {
            border: 1px solid #000;
            background: #fff;
            border-radius: 4px;
            touch-action: none;
            cursor: crosshair;
            width: 100%;
            max-width: 320px;
        }
        .sig-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 12px;
        }
        .sig-btns button {
            padding: 10px 16px;
            font-size: 17px;
            min-width: auto;
            flex: initial;
        }
        .sig-img {
            max-height: 70px;
            border-bottom: 1.5px solid #333;
            display: block;
            margin: 0 auto;
        }
        .pagination-info {
            font-weight: bold;
            font-size: 20px;
            margin: 0 5px;
        }

        /* Perfect Print Settings for A4 (2 A5 Cards per Page) with compact font size */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0.3in;
            }
            body {
                background: none;
                padding: 0;
                font-size: 12px !important;
                -webkit-print-color-adjust: exact;
            }
            .container > *:not(#printArea), .nav-buttons, .action-buttons, .signature-container, input[type="file"], .tracker-box, .stats-container, .header-section, .main-title {
                display: none !important;
            }
            .container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
                width: 100%;
            }
            .card-box {
                border: 2px solid #000 !important;
                padding: 10px !important;
                margin: 0 0 15px 0 !important;
                height: 48vh !important;
                page-break-inside: avoid;
            }
            input, select {
                border: none !important;
                background: transparent !important;
                appearance: none;
                -webkit-appearance: none;
                font-size: 12px !important;
                padding: 2px !important;
            }
            .btn-now { display: none !important; }
            table, th, td {
                border: 1px solid #000 !important;
                padding: 4px 2px !important;
                font-size: 11px !important;
            }
            .form-row label, .inline-item label {
                font-size: 12px !important;
            }
        }

        .bulk-print-container {
            display: none;
        }
        @media print {
            .single-view-mode { display: none !important; }
            .bulk-print-container { display: block !important; }
        }
    </style>
</head>
<body>

<div class="container single-view-mode">
    <div class="main-title">വരിസംഖ്യാ കാർഡ്</div>

    <div class="header-section">
        <div class="header-box">
            <label>മദ്റസ:</label>
            <input type="text" id="madrasaName" placeholder="മദ്റസയുടെ പേര്" onchange="saveHeaderData()">
        </div>
        <div class="header-box">
            <label>സ്ഥലം:</label>
            <input type="text" id="madrasaPlace" placeholder="സ്ഥലം" onchange="saveHeaderData()">
        </div>
        <div class="header-box">
            <label>അംഗീകാര നമ്പർ:</label>
            <input type="text" id="madrasaRegNo" placeholder="അംഗീകാര നമ്പർ" onchange="saveHeaderData()">
        </div>
    </div>

    <div class="stats-container">
        <div class="stat-box">
            <h4>ഈ വർഷം ആകെ വരവ് (Total Yearly)</h4>
            <div class="amount" id="yearlyTotalDisplay">₹0</div>
        </div>
        <div class="stat-box">
            <h4>ഈ മാസം ആകെ വരവ് (Total Monthly)</h4>
            <div class="amount" id="monthlyTotalDisplay">₹0</div>
        </div>
    </div>

    <div class="tracker-box">
        <h3>📊 മാസാടിസ്ഥാനത്തിലുള്ള ഫീസ് സ്റ്റാറ്റസ്</h3>
        <div class="tracker-controls">
            <div>
                <label>വർഷം:</label>
                <select id="filterYear" onchange="updateStatusTracker()">
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                    <option value="2029">2029</option>
                    <option value="2030">2030</option>
                    <option value="2031">2031</option>
                    <option value="2032">2032</option>
                    <option value="2033">2033</option>
                    <option value="2034">2034</option>
                    <option value="2035">2035</option>
                    <option value="2036">2036</option>
                    <option value="2037">2037</option>
                    <option value="2038">2038</option>
                </select>
            </div>
            <div>
                <label>മാസം:</label>
                <select id="filterMonth" onchange="updateStatusTracker()">
                    <option value="ജനുവരി">ജനുവരി</option>
                    <option value="ഫെബ്രുവരി">ഫെബ്രുവരി</option>
                    <option value="മാർച്ച്">മാർച്ച്</option>
                    <option value="ഏപ്രിൽ">ഏപ്രിൽ</option>
                    <option value="മെയ്">മെയ്</option>
                    <option value="ജൂൺ">ജൂൺ</option>
                    <option value="ജൂലൈ">ജൂലൈ</option>
                    <option value="ആഗസ്റ്റ്">ആഗസ്റ്റ്</option>
                    <option value="സെപ്തംബർ">സെപ്തംബർ</option>
                    <option value="ഒക്ടോബർ">ഒക്ടോബർ</option>
                    <option value="നവംബർ">നവംബർ</option>
                    <option value="ഡിസംബർ">ഡിസംബർ</option>
                </select>
            </div>
        </div>
        <div class="tracker-results">
            <div class="result-col" style="border-color: #28a745;">
                <h5 style="color: #28a745;">✅ ഫീസ് അടച്ചവർ (<span id="paidCount">0</span>)</h5>
                <ul id="paidStudentsList"></ul>
            </div>
            <div class="result-col" style="border-color: #dc3545;">
                <h5 style="color: #dc3545;">❌ ഫീസ് അടക്കാത്തവർ (<span id="unpaidCount">0</span>)</h5>
                <ul id="unpaidStudentsList"></ul>
            </div>
        </div>
    </div>

    <div class="nav-buttons">
        <div>
            <button onclick="prevStudent()">◀ മുമ്പത്തെ</button>
            <span class="pagination-info" id="pageIndicator">കുട്ടി 1 / 1</span>
            <button onclick="nextStudent()">അടുത്തത് ▶</button>
        </div>
        <div style="display:flex; gap:8px; width:100%; margin-top:8px;">
            <button class="btn-secondary" onclick="addNewStudent()">+ പുതിയ കുട്ടി</button>
            <button class="btn-danger" onclick="deleteCurrentStudent()">നീക്കം ചെയ്യുക</button>
        </div>
    </div>

    <div class="card-box" id="printArea">
        <div class="form-row">
            <label>വിദ്യാർത്ഥിയുടെ പേര്:</label>
            <input type="text" id="studentName" placeholder="വിദ്യാർത്ഥിയുടെ പേര്">
        </div>
        <div class="form-row">
            <label>രക്ഷാകർത്താവിന്റെ പേര്:</label>
            <input type="text" id="guardianName" placeholder="രക്ഷാകർത്താവിന്റെ പേര്">
        </div>
        <div class="form-row">
            <label>വാട്സാപ്പ് നമ്പർ:</label>
            <input type="text" id="whatsappNo" placeholder="919847xxxxxx">
        </div>

        <div class="form-row">
            <div class="inline-group">
                <div class="inline-item">
                    <label>ക്ലാസ്:</label>
                    <input type="text" id="studentClass" placeholder="ക്ലാസ്">
                </div>
                <div class="inline-item">
                    <label>റോൾ നമ്പർ:</label>
                    <input type="text" id="rollNo" placeholder="റോൾ നമ്പർ">
                </div>
                <div class="inline-item">
                    <label>ഫീസ് RS:</label>
                    <input type="text" id="feeAmount" placeholder="ഫീസ്">
                </div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">📅 വർഷം</th>
                    <th style="width: 18%;">🗓️ മാസം</th>
                    <th style="width: 18%;">💰 തുക</th>
                    <th style="width: 34%;">📆 തീയതി & സമയം</th>
                    <th style="width: 15%;">⚖️ ബാക്കി</th>
                </tr>
            </thead>
            <tbody id="monthsTableBody"></tbody>
        </table>

        <div class="form-row">
            <label>ഉസ്താദിന്റെ പേര്:</label>
            <input type="text" id="teacherName" placeholder="ഉസ്താദിന്റെ പേര്">
        </div>
        <div class="form-row">
            <label>ഒപ്പ്:</label>
            <div style="flex:1; text-align:center;">
                <div id="sigDisplayContainer">
                    <span id="noSigText" style="color:#888; font-size:18px;">(ഒപ്പ് രേഖപ്പെടുത്തിയിട്ടില്ല)</span>
                    <img id="sigImage" class="sig-img" style="display:none;" alt="Digital Signature">
                </div>
            </div>
        </div>

        <div class="signature-container">
            <label style="font-size: 18px;"><strong>ഡിജിറ്റൽ ഒപ്പ് രേഖപ്പെടുത്താൻ:</strong></label><br>
            <canvas id="sigCanvas" width="300" height="100"></canvas>
            <div class="sig-btns">
                <button type="button" onclick="saveSignature()">ഒപ്പ് സേവ് ചെയ്യുക</button>
                <button type="button" class="btn-danger" onclick="clearSignatureCanvas()">മായ്ക്കുക</button>
            </div>
        </div>
    </div>

    <div class="action-buttons" style="margin-top: 20px;">
        <button class="btn-whatsapp" onclick="sendWhatsApp()">📱 വാട്സാപ്പ് അയക്കുക</button>
        <button class="btn-secondary" onclick="window.print()">🖨️ പ്രിന്റ് ചെയ്യുക (A4 ൽ 2 കാർഡുകൾ)</button>
        <button class="btn-bulk-print" onclick="printAllStudents()">🖨️ എല്ലാവരെയും പ്രിന്റ് ചെയ്യുക</button>
        <button onclick="exportData()">💾 ബാക്ക്അപ്പ് (Export)</button>
        <button class="btn-secondary" onclick="document.getElementById('importFile').click()">📂 ഡാറ്റ ലോഡ് (Import)</button>
        <input type="file" id="importFile" style="display:none" onchange="importData(event)">
    </div>
</div>

<div id="bulkPrintArea" class="bulk-print-container"></div>

<script>
    const months = [
        "ജനുവരി", "ഫെബ്രുവരി", "മാർച്ച്", "ഏപ്രിൽ", "മെയ്", "ജൂൺ", 
        "ജൂലൈ", "ആഗസ്റ്റ്", "സെപ്തംബർ", "ഒക്ടോബർ", "നവംബർ", "ഡിസംബർ"
    ];

    const years = ["2026", "2027", "2028", "2029", "2030", "2031", "2032", "2033", "2034", "2035", "2036", "2037", "2038"];

    let headerData = JSON.parse(localStorage.getItem('madrasa_header')) || {
        name: 'മദ്റസത്തുണ്ണൂർ',
        place: 'ആസാദ് നഗർ',
        regNo: '6502'
    };

    let students = JSON.parse(localStorage.getItem('madrasa_students')) || [createEmptyStudent()];
    let currentIndex = 0;

    function createEmptyStudent() {
        let mData = {};
        months.forEach(m => {
            mData[m] = { year: '2026', amount: '', dateTime: '', balance: '' };
        });

        return {
            studentName: '',
            guardianName: '',
            whatsappNo: '',
            studentClass: '',
            rollNo: '',
            feeAmount: '100',
            teacherName: '',
            signatureData: '',
            monthsData: mData
        };
    }

    function saveHeaderData() {
        headerData.name = document.getElementById('madrasaName').value;
        headerData.place = document.getElementById('madrasaPlace').value;
        headerData.regNo = document.getElementById('madrasaRegNo').value;
        localStorage.setItem('madrasa_header', JSON.stringify(headerData));
    }

    function calculateTotals() {
        let yearlyTotal = 0;
        let monthlyTotal = 0;

        let filterYr = document.getElementById('filterYear').value;
        let filterMo = document.getElementById('filterMonth').value;

        students.forEach(s => {
            if (s.monthsData) {
                for (let m of months) {
                    let mData = s.monthsData[m];
                    if (mData && mData.amount && parseFloat(mData.amount) > 0) {
                        let amt = parseFloat(mData.amount) || 0;
                        let yr = mData.year || '2026';
                        
                        if (yr === filterYr) {
                            yearlyTotal += amt;
                            if (m === filterMo) {
                                monthlyTotal += amt;
                            }
                        }
                    }
                }
            }
        });

        document.getElementById('yearlyTotalDisplay').innerText = `₹${yearlyTotal}`;
        document.getElementById('monthlyTotalDisplay').innerText = `₹${monthlyTotal}`;
    }

    function updateStatusTracker() {
        let selYear = document.getElementById('filterYear').value;
        let selMonth = document.getElementById('filterMonth').value;

        let paidList = document.getElementById('paidStudentsList');
        let unpaidList = document.getElementById('unpaidStudentsList');
        paidList.innerHTML = '';
        unpaidList.innerHTML = '';

        let paidCount = 0;
        let unpaidCount = 0;

        students.forEach((s, index) => {
            let mData = s.monthsData ? s.monthsData[selMonth] : null;
            let isPaid = mData && mData.amount && parseFloat(mData.amount) > 0 && mData.year === selYear;

            let li = document.createElement('li');
            li.innerText = `${s.studentName || 'പേരില്ലാത്ത കുട്ടി'} (ക്ലാസ്: ${s.studentClass || '-'})`;
            li.onclick = function() {
                currentIndex = index;
                loadStudentData();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            if (isPaid) {
                paidList.appendChild(li);
                paidCount++;
            } else {
                unpaidList.appendChild(li);
                unpaidCount++;
            }
        });

        document.getElementById('paidCount').innerText = paidCount;
        document.getElementById('unpaidCount').innerText = unpaidCount;
        calculateTotals();
    }

    function initTable() {
        const tbody = document.getElementById('monthsTableBody');
        tbody.innerHTML = '';
        let currentStudent = students[currentIndex];

        months.forEach(m => {
            let rowData = currentStudent.monthsData[m] || { year: '2026', amount: '', dateTime: '', balance: '' };
            
            let yearOptions = years.map(yr => `<option value="${yr}" ${rowData.year === yr ? 'selected' : ''}>${yr}</option>`).join('');

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td><select style="width:100%; padding:8px; font-size:17px;" onchange="updateMonthData('${m}', 'year', this.value)">${yearOptions}</select></td>
                <td><b>${m}</b></td>
                <td><input type="text" id="amt_${m}" value="${rowData.amount}" oninput="onAmountInput('${m}', this.value)" placeholder="തുക"></td>
                <td>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <input type="datetime-local" id="dt_${m}" value="${rowData.dateTime}" onchange="updateMonthData('${m}', 'dateTime', this.value)" style="font-size:14px; padding:6px;">
                        <button type="button" class="btn-now" onclick="setCurrentDateTime('${m}')">ഇന്ന്</button>
                    </div>
                </td>
                <td><input type="text" id="bal_${m}" value="${rowData.balance}" oninput="updateMonthData('${m}', 'balance', this.value)" placeholder="ബാക്കി"></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function onAmountInput(month, value) {
        if(!students[currentIndex].monthsData[month]) {
            students[currentIndex].monthsData[month] = { year: '2026', amount: '', dateTime: '', balance: '' };
        }
        students[currentIndex].monthsData[month]['amount'] = value;

        let dtInput = document.getElementById(`dt_${month}`);

        if (value.trim() !== '' && parseFloat(value) > 0) {
            if (!students[currentIndex].monthsData[month]['dateTime']) {
                let now = new Date();
                let localISO = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
                students[currentIndex].monthsData[month]['dateTime'] = localISO;
                if(dtInput) dtInput.value = localISO;
            }
        } else {
            students[currentIndex].monthsData[month]['dateTime'] = '';
            if(dtInput) dtInput.value = '';
        }

        localStorage.setItem('madrasa_students', JSON.stringify(students));
        updateStatusTracker();
    }

    function setCurrentDateTime(month) {
        let now = new Date();
        let localISO = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
        updateMonthData(month, 'dateTime', localISO);
        let dtInput = document.getElementById(`dt_${month}`);
        if(dtInput) dtInput.value = localISO;
    }

    function loadStudentData() {
        document.getElementById('madrasaName').value = headerData.name;
        document.getElementById('madrasaPlace').value = headerData.place;
        document.getElementById('madrasaRegNo').value = headerData.regNo;

        if (students.length === 0) {
            students.push(createEmptyStudent());
            currentIndex = 0;
        }
        let s = students[currentIndex];
        document.getElementById('studentName').value = s.studentName;
        document.getElementById('guardianName').value = s.guardianName;
        document.getElementById('whatsappNo').value = s.whatsappNo;
        document.getElementById('studentClass').value = s.studentClass;
        document.getElementById('rollNo').value = s.rollNo || '';
        document.getElementById('feeAmount').value = s.feeAmount;
        document.getElementById('teacherName').value = s.teacherName;

        let sigImg = document.getElementById('sigImage');
        let noSigText = document.getElementById('noSigText');
        if (s.signatureData) {
            sigImg.src = s.signatureData;
            sigImg.style.display = 'block';
            noSigText.style.display = 'none';
        } else {
            sigImg.style.display = 'none';
            noSigText.style.display = 'inline';
        }

        document.getElementById('pageIndicator').innerText = `കുട്ടി ${currentIndex + 1} / ${students.length}`;
        initTable();
        clearSignatureCanvas();
        updateStatusTracker();
    }

    function saveCurrentStudentFromDOM() {
        let s = students[currentIndex];
        s.studentName = document.getElementById('studentName').value;
        s.guardianName = document.getElementById('guardianName').value;
        s.whatsappNo = document.getElementById('whatsappNo').value;
        s.studentClass = document.getElementById('studentClass').value;
        s.rollNo = document.getElementById('rollNo').value;
        s.feeAmount = document.getElementById('feeAmount').value;
        s.teacherName = document.getElementById('teacherName').value;
        localStorage.setItem('madrasa_students', JSON.stringify(students));
        calculateTotals();
    }

    function updateMonthData(month, field, value) {
        if(!students[currentIndex].monthsData[month]) {
            students[currentIndex].monthsData[month] = { year: '2026', amount: '', dateTime: '', balance: '' };
        }
        students[currentIndex].monthsData[month][field] = value;
        localStorage.setItem('madrasa_students', JSON.stringify(students));
        updateStatusTracker();
    }

    document.querySelectorAll('#printArea input:not([type="datetime-local"])').forEach(input => {
        input.addEventListener('input', () => {
            saveCurrentStudentFromDOM();
        });
    });

    function nextStudent() {
        saveCurrentStudentFromDOM();
        if (currentIndex < students.length - 1) {
            currentIndex++;
            loadStudentData();
        }
    }

    function prevStudent() {
        saveCurrentStudentFromDOM();
        if (currentIndex > 0) {
            currentIndex--;
            loadStudentData();
        }
    }

    function addNewStudent() {
        saveCurrentStudentFromDOM();
        students.push(createEmptyStudent());
        currentIndex = students.length - 1;
        loadStudentData();
    }

    function deleteCurrentStudent() {
        if (students.length === 1) {
            alert("കുറഞ്ഞത് ഒരു കാർഡ് എങ്കിലും ഉണ്ടായിരിക്കണം!");
            return;
        }
        if (confirm("ഈ കുട്ടിയുടെ ഡാറ്റ നീക്കം ചെയ്യണമെന്ന് ഉറപ്പാണോ?")) {
            students.splice(currentIndex, 1);
            if (currentIndex >= students.length) {
                currentIndex = students.length - 1;
            }
            localStorage.setItem('madrasa_students', JSON.stringify(students));
            loadStudentData();
        }
    }

    function sendWhatsApp() {
        saveCurrentStudentFromDOM();
        let s = students[currentIndex];
        let rawPhone = s.whatsappNo.replace(/[^0-9]/g, '');
        
        if (!rawPhone) {
            alert("ദയവായി രക്ഷാകർത്താവിന്റെ വാട്സാപ്പ് നമ്പർ നൽകുക!");
            return;
        }

        let mName = headerData.name || 'മദ്റസാ';
        let sClass = s.studentClass || '';
        let sName = s.studentName || '';
        
        let selMonth = document.getElementById('filterMonth').value;
        let mData = s.monthsData ? s.monthsData[selMonth] : null;
        let amountPaid = mData && mData.amount ? mData.amount : (s.feeAmount || '');

        let dtVal = mData && mData.dateTime ? new Date(mData.dateTime) : new Date();
        let formattedDate = dtVal.toLocaleDateString('ml-IN');
        let formattedTime = dtVal.toLocaleTimeString('ml-IN', { hour: '2-digit', minute: '2-digit' });

        let messageText = `*${mName}യിലെ ${sClass} ക്ലാസ്സിൽ പഠിക്കുന്ന ${sName} കുട്ടി ${selMonth} മാസത്തെ ഫീസായി ${amountPaid} രൂപ അടച്ചു. അല്ലാഹു സ്വീകരിക്കട്ടെ!* (തീയതി: ${formattedDate}, സമയം: ${formattedTime})`;

        let waUrl = `https://api.whatsapp.com/send?phone=${rawPhone}&text=${encodeURIComponent(messageText)}`;
        window.open(waUrl, '_blank');
    }

    function exportData() {
        saveCurrentStudentFromDOM();
        let exportObj = { header: headerData, students: students };
        let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj));
        let downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "madrasa_fee_data.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importData(event) {
        let file = event.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let imported = JSON.parse(e.target.result);
                if (imported.students && Array.isArray(imported.students)) {
                    students = imported.students;
                    if(imported.header) headerData = imported.header;
                } else if (Array.isArray(imported)) {
                    students = imported;
                }
                currentIndex = 0;
                localStorage.setItem('madrasa_header', JSON.stringify(headerData));
                localStorage.setItem('madrasa_students', JSON.stringify(students));
                loadStudentData();
                alert("ഡാറ്റ വിജയകരമായി ലോഡ് ചെയ്തു!");
            } catch (err) {
                alert("ഫയൽ ലോഡ് ചെയ്യുന്നതിൽ പരാജയപ്പെട്ടു!");
            }
        };
        reader.readAsText(file);
    }

    function printAllStudents() {
        saveCurrentStudentFromDOM();
        let bulkContainer = document.getElementById('bulkPrintArea');
        bulkContainer.innerHTML = '';

        for (let i = 0; i < students.length; i += 2) {
            let pageDiv = document.createElement('div');
            pageDiv.style.pageBreakAfter = 'always';
            pageDiv.style.height = '100vh';

            for (let j = i; j < i + 2 && j < students.length; j++) {
                let s = students[j];
                let cardDiv = document.createElement('div');
                cardDiv.className = 'card-box';
                cardDiv.style.height = '47vh';
                cardDiv.style.marginBottom = '10px';

                let monthsRows = months.map(m => {
                    let r = s.monthsData[m] || { year: '2026', amount: '', dateTime: '', balance: '' };
                    return `<tr>
                        <td><b>${r.year}</b></td>
                        <td><b>${m}</b></td>
                        <td>${r.amount || '-'}</td>
                        <td>${r.dateTime ? new Date(r.dateTime).toLocaleString('ml-IN') : '-'}</td>
                        <td>${r.balance || '-'}</td>
                    </tr>`;
                }).join('');

                cardDiv.innerHTML = `
                    <h3 style="text-align:center; margin:0 0 4px 0; font-size:14px; color:#006633;">${headerData.name} (${headerData.place}) - വരിസംഖ്യാ കാർഡ്</h3>
                    <div style="font-size:13px; margin-bottom:3px;"><strong>വിദ്യാർത്ഥി:</strong> ${s.studentName} | <strong>ക്ലാസ്:</strong> ${s.studentClass} | <strong>റോൾ നം:</strong> ${s.rollNo || '-'}</div>
                    <div style="font-size:13px; margin-bottom:5px;"><strong>രക്ഷാകർത്താവ്:</strong> ${s.guardianName}</div>
                    <table style="width:100%; border-collapse:collapse; font-size:11px;">
                        <thead>
                            <tr style="background:#f1f3f5;">
                                <th>വർഷം</th><th>മാസം</th><th>തുക</th><th>തിയ്യതി & സമയം</th><th>ബാക്കി</th>
                            </tr>
                        </thead>
                        <tbody>${monthsRows}</tbody>
                    </table>
                    <div style="margin-top:4px; font-size:12px; display:flex; justify-content:space-between;">
                        <span><strong>ഉസ്താദ്:</strong> ${s.teacherName || '-'}</span>
                        <span><strong>ഒപ്പ്:</strong> ${s.signatureData ? '<img src="'+s.signatureData+'" style="height:25px; vertical-align:middle;" />' : '(-)'}</span>
                    </div>
                `;
                pageDiv.appendChild(cardDiv);
            }
            bulkContainer.appendChild(pageDiv);
        }

        window.print();
    }

    const canvas = document.getElementById('sigCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000';

    function getCanvasPos(e) {
        let rect = canvas.getBoundingClientRect();
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function startDrawing(e) {
        isDrawing = true;
        let pos = getCanvasPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        e.preventDefault();
    }

    function draw(e) {
        if (!isDrawing) return;
        let pos = getCanvasPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        e.preventDefault();
    }

    function stopDrawing() {
        isDrawing = false;
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', stopDrawing);

    function clearSignatureCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function saveSignature() {
        let dataURL = canvas.toDataURL();
        students[currentIndex].signatureData = dataURL;
        localStorage.setItem('madrasa_students', JSON.stringify(students));
        loadStudentData();
        alert("ഒപ്പ് വിജയകരമായി സേവ് ചെയ്തു!");
    }

    loadStudentData();
</script>
